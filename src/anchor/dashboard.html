<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANCHOR 관제</title>
<style>
body{font:15px system-ui,sans-serif;max-width:1200px;margin:32px auto;padding:0 24px;color:#192027;background:#fff}
h1{font-size:28px}h2{font-size:18px;margin-top:28px}input,button,select{font:inherit;padding:9px;border:1px solid #aaa;border-radius:4px;margin:4px}
button{cursor:pointer;background:#f2f5f7}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #ddd}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f7f7;padding:14px}.metrics{display:flex;flex-wrap:wrap;gap:16px}.card{border:1px solid #c8ced3;padding:18px;min-width:150px}.card strong{display:block;font-size:28px}.muted{color:#66717b}#error{color:#a40019}label{display:inline-block}#auth{margin:20px 0}.hidden{display:none}
</style>
<h1>ANCHOR <span id="role">관제</span></h1><p class="muted">선박의 원본 · 연안의 보관 확인 · 육상의 최종 수신을 따로 표시합니다.</p>
<div id="auth"><label>관제 토큰 <input id="token" type="password" autocomplete="off"></label><button id="connect">연결</button></div>
<p id="fresh">연결 대기</p><p id="error" role="alert"></p><div id="metrics" class="metrics"></div>
<h2>통신 경로</h2><div id="links"></div>
<h2>실제 센서</h2><table><thead><tr><th>장치 / 센서</th><th>최근 값</th><th>측정 시각</th></tr></thead><tbody id="sensors"></tbody></table>
<h2>사건과 현장 확인</h2><label>담당자 <input id="operator" maxlength="80"></label><div id="incidents"></div>
<section id="issue" class="hidden"><h2>보고 주기 명령</h2><p>BRIDGE의 자세 저장 주기와 ENGINE의 진동 통계 창을 바꿉니다. DHT11 및 20 Hz 실시간 영상용 값은 대상이 아닙니다.</p>
<label>대상 <select id="target"><option>reportingGroup</option><option>bridge</option><option>engine</option></select></label>
<label>간격(ms) <input id="interval" type="number" value="200" min="200" max="5000" step="5"></label>
<label>유지(초) <input id="duration" type="number" value="30" min="1" max="300"></label>
<label>유효시간(초) <input id="ttl" type="number" value="120" min="1" max="3600"></label><button id="submit">명령 저장</button></section>
<h2>명령과 장치 적용 결과</h2><div id="commands"></div>
<h2>전송 검증</h2><label>촬영 배치 이름 <input id="batch" value="demo-01"></label><button id="capture">현재 수집분 고정</button><button id="check">최종 수신 대조</button><pre id="batchResult">촬영 전후 동일한 배치의 ID와 해시를 비교합니다.</pre>
<details><summary>진단</summary><pre id="diagnostics"></pre></details>
<script>
const $=id=>document.getElementById(id);let token='',busy=false;
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}
function text(tag,value){const e=document.createElement(tag);e.textContent=value;return e}
function time(value){return value?new Date(value*1000).toLocaleTimeString():'미수신'}
async function action(fn){try{$('error').textContent='';await fn()}catch(e){$('error').textContent=e.message}}
async function refresh(){if(!token||busy)return;busy=true;try{const s=await api('/status');$('role').textContent={ship:'선박',edge:'연안',shore:'육상'}[s.role];$('fresh').textContent=`최근 수집 확인 ${time(s.lastScanAt)} · ${s.ready?'가동':'준비 중'} · 경과 ${s.lastScanAt?Math.round(Date.now()/1000-s.lastScanAt):'-'}초`;
$('metrics').replaceChildren();for(const [label,key] of [['보관 원본','accepted'],['연안 보관 확인','coastCustody'],['육상 최종 확인','shoreConfirmed'],['최종 확인 대기','pendingFinal']]){const c=text('div',label);c.className='card';c.append(text('strong',s.delivery[key]));$('metrics').append(c)}
$('links').replaceChildren();for(const [name,v] of Object.entries(s.links))$('links').append(text('p',`${name}: ${v.reachable?'연결됨':'응답 없음'} · 확인 ${time(v.observedAt)}`));
$('sensors').replaceChildren();for(const [name,e] of Object.entries(s.latest)){const tr=document.createElement('tr');const p={...e.payload};for(const k of ['eventId','bootId','vesselId','deviceId','seq','ts','uptimeMs','droppedBefore'])delete p[k];for(const v of [name,JSON.stringify(p),time(e.generatedAt)])tr.append(text('td',v));$('sensors').append(tr)}
$('incidents').replaceChildren();for(const e of s.incidents){const row=text('p',`${e.payload.incidentId} · ${e.payload.status||'담당자 확인'} · ${time(e.generatedAt)}`);if(e.kind==='incident'&&e.payload.status==='opened'&&s.role!=='ship'){const b=text('button','현장 확인');b.onclick=()=>action(()=>api('/incidents/ack',{incidentId:e.payload.incidentId,operator:$('operator').value}));row.append(b)}$('incidents').append(row)}
$('issue').classList.toggle('hidden',s.role!=='shore');$('commands').replaceChildren();for(const c of s.commands)$('commands').append(text('pre',`${c.commandId} · ${c.target} · ${c.status}\n${JSON.stringify(c.devices,null,2)}`));
$('diagnostics').textContent=JSON.stringify({sequenceGaps:s.sequenceGaps,pchReceived:s.pollingChannelReceived,notifications:s.notificationRequests,errors:s.errors},null,2);
}catch(e){$('error').textContent=e.message;$('fresh').textContent='관제 API 응답 없음 — 표시된 값은 마지막 수신 값입니다.'}finally{busy=false}}
$('connect').onclick=()=>{token=$('token').value;refresh()};$('submit').onclick=()=>action(async()=>{await api('/commands',{target:$('target').value,intervalMs:Number($('interval').value),durationMs:Number($('duration').value)*1000,ttlMs:Number($('ttl').value)*1000});await refresh()});
$('capture').onclick=()=>action(async()=>{$('batchResult').textContent=JSON.stringify(await api('/batches',{batchId:$('batch').value}),null,2)});
$('check').onclick=()=>action(async()=>{$('batchResult').textContent=JSON.stringify(await api('/batches/'+encodeURIComponent($('batch').value)),null,2)});setInterval(refresh,2000);
</script></html>
