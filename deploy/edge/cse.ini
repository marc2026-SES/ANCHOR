; Start with run.sh cse (secure ACME adapter required).
[basic.config]
cseType=MN
cseID=id-edge
cseName=cse-edge
cseHost=edge.local
httpPort=8080
networkInterface=0.0.0.0
databaseType=tinydb
adminID=CAdmin
serviceProviderID=//anchor.ctrlsea

[cse]
enableRemoteCSE=true
requestExpirationDelta=3

[cse.security]
enableACPChecks=true

[cse.registration]
allowedCSROriginators=/id-ship,/id-edge,/id-in
checkLiveliness=false
unregisterWhenStopping=false

[resource.cnt]
; Application/firmware capacity guards pause new writes; never silently evict.
enableLimits=false

[database.tinydb]
cacheSize=0
writeDelay=0

[mqtt]
enable=false
address=127.0.0.1
port=8883

[logging]
level=warn
enableFileLogging=true

[textui]
enable=false
[webui]
enable=false

[cse.registrar]
address=https://shore.local:8080
cseID=/id-in
resourceName=cse-in
INCSEcseID=/id-in

[http.security]
useTLS=true
verifyCertificate=true
tlsVersion=auto
caCertificateFile=${ANCHOR_TLS_DIR}/server.crt
caPrivateKeyFile=${ANCHOR_TLS_DIR}/server.key

[mqtt.security]
useTLS=true
verifyCertificate=true
caCertificateFile=${ANCHOR_TLS_DIR}/ca.crt
