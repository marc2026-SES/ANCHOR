# Linux coastal host. This packages the CSE and optional DDS IPE; it is not a MEC platform installation.
services:
  edge-cse:
    user: "${ANCHOR_UID:-1000}:${ANCHOR_GID:-1000}"
    environment:
      ANCHOR_TLS_DIR: /secrets/tls
    build:
      context: ../..
      dockerfile: deploy/edge/Dockerfile.cse
      args:
        ANCHOR_UID: "${ANCHOR_UID:-1000}"
        ANCHOR_GID: "${ANCHOR_GID:-1000}"
    network_mode: host
    restart: unless-stopped
    volumes:
      - edge-cse-data:/var/lib/acme
      - ./cse.ini:/etc/anchor/edge.ini:ro
      - ./host.container.json:/config/host.container.json:ro
      - ../../.runtime-edge/tls:/secrets/tls:ro
  edge-dds-ipe:
    profiles: ["dds"]
    user: "${ANCHOR_UID:-1000}:${ANCHOR_GID:-1000}"
    build:
      context: ../..
      dockerfile: deploy/edge/Dockerfile.dds
    network_mode: host
    restart: unless-stopped
    depends_on:
      - edge-cse
    volumes:
      - ./dds.container.json:/config/dds.container.json:ro
      - ./host.container.json:/config/host.container.json:ro
      - ../../.runtime-edge/tls:/secrets/tls:ro
volumes:
  edge-cse-data:
