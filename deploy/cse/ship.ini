[basic.config]
cseType=MN
cseID=id-ship
cseName=cse-ship
cseHost=ship.local
httpPort=8080
networkInterface=0.0.0.0
databaseType=tinydb
adminID=CAdmin
serviceProviderID=//anchor.ctrlsea

[cse]
enableRemoteCSE=true
requestExpirationDelta=3

[cse.security]
enableACPChecks=true

[cse.registration]
allowedCSROriginators=/id-ship,/id-edge,/id-in
checkLiveliness=false
unregisterWhenStopping=false

[resource.cnt]
; Application/firmware capacity guards pause new writes; never silently evict.
enableLimits=false

[database.tinydb]
cacheSize=0
writeDelay=0

[mqtt]
enable=true
address=127.0.0.1
port=1883

[logging]
level=warn
enableFileLogging=true

[textui]
enable=false
[webui]
enable=false

[cse.registrar]
address=http://edge.local:8080
cseID=/id-edge
resourceName=cse-edge
INCSEcseID=/id-in
