; ANCHOR ship gateway MN-CSE (Raspberry Pi 5)
[basic.config]
cseType=MN
cseID=id-ship
cseName=cse-ship
serviceProviderID=//anchor.ctrlsea
adminID=CAdmin
networkInterface=0.0.0.0
; fixed secondary IP on wlan0 (the hotspot DHCP address can collide with an ESP32)
cseHost=10.251.196.250
httpPort=8080
databaseType=tinydb
logLevel=info
consoleType=simple
consoleTheme=dark
; Registrar = shore IN-CSE (Pi 4)
registrarCseHost=10.251.196.64
registrarCsePort=8080
registrarCseID=id-in
registrarCseName=cse-in

[mqtt]
enable=true
address=127.0.0.1
port=1883

[resource.cnt]
; keep enough history to cover an outage (1 Hz sensors, ~6 h)
enableLimits=true
mni=20000
mbs=5000000

[logging]
enableFileLogging=true
enableScreenLogging=true

[console]
headless=true

[textui]
enable=false
startWithTUI=false

[cse.security]
; Approved by the team (2026-11-15): team AI apps / dashboards and the shore IN-CSE
; (forwarded as /id-in/<orig>) must read ship resources created by the ESP32 AEs.
enableACPChecks=false
