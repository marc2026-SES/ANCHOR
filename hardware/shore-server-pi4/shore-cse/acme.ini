; ANCHOR shore IN-CSE (Raspberry Pi 4) - ACME, same IDs the tinyIoT IN used so the ship needs no change
[basic.config]
cseType=IN
cseID=id-in
cseName=cse-in
serviceProviderID=//anchor.ctrlsea
adminID=CAdmin
networkInterface=0.0.0.0
cseHost=10.251.196.64
httpPort=8080
databaseType=tinydb
logLevel=info
consoleType=simple
consoleTheme=dark

[mqtt]
enable=false

[resource.cnt]
; replicated ship history (ship-gw/<node>/<sensor>)
enableLimits=false
mni=5000
mbs=5000000

[logging]
enableFileLogging=true
enableScreenLogging=true

[console]
headless=true

[textui]
enable=false
startWithTUI=false

[cse.registration]
; only the ship MN-CSE may register as a remoteCSE (ACP checks stay on).
; Must be SP-relative ("/id-ship"); the default file comment saying "no leading /" is wrong.
allowedCSROriginators=/id-ship
